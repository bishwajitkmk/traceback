name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  TRACEBACK_TEST_DB: postgresql+psycopg://traceback:traceback@localhost:5432/traceback_test

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traceback
          POSTGRES_PASSWORD: traceback
          POSTGRES_DB: traceback_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traceback" --health-interval 3s --health-retries 20
    env:
      TRACEBACK_DATABASE_URL: postgresql+psycopg://traceback:traceback@localhost:5432/traceback_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff format --check . && ruff check .
      - run: alembic upgrade head && alembic check
      - run: pytest

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" -r ../examples/sample_app/requirements.txt
      - run: ruff check src tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    # Full capture → replay → regression → verify flow on the real stack.
    runs-on: ubuntu-latest
    needs: [backend, sdk, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traceback
          POSTGRES_PASSWORD: traceback
          POSTGRES_DB: traceback
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traceback" --health-interval 3s --health-retries 20
    env:
      TRACEBACK_DATABASE_URL: postgresql+psycopg://traceback:traceback@localhost:5432/traceback
      TRACEBACK_CORS_ORIGINS: http://localhost:5180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend venv and migrations
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e . && .venv/bin/alembic upgrade head
      - name: SDK + sample app venv
        working-directory: sdk
        run: python -m venv .venv && .venv/bin/pip install -e . -r ../examples/sample_app/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: frontend/test-results }

  backend-image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t traceback-api ./backend
