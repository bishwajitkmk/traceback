[project]
name = "traceback-api"
version = "0.1.0"
description = "Traceback core API: ingestion, incidents, replay and regression cases."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1",
  "httpx>=0.28,<0.29",  # outbound.py builds the connection pool itself
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not a first-party package

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S107"]  # fake credentials and addresses are test data

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
